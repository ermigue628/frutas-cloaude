<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frutería Tropical Costa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf8f1;--card:#fff;--tx:#2b2a26;--mu:#76705f;--ac:#e2711d;--bd:#e6dfce;--hd:#f6e3c8;--ok:#1f6fd1;--er:#c62828;--c1:#2e9d6b;--c2:#e2711d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b18;--card:#262520;--tx:#f1ede2;--mu:#a49e8c;--bd:#3a382f;--hd:#3b3426;--ok:#7db4ff;--er:#ff8a80;--c1:#4cc790;--c2:#f2994a}}
:root[data-theme="dark"]{--bg:#1c1b18;--card:#262520;--tx:#f1ede2;--mu:#a49e8c;--bd:#3a382f;--hd:#3b3426;--ok:#7db4ff;--er:#ff8a80;--c1:#4cc790;--c2:#f2994a}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:auto;padding:18px 16px 40px}
h1{margin:0 0 12px;font-size:22px}h1 span{color:var(--ac)}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font:inherit}
.msg{width:100%;color:var(--er);font-size:13px;min-height:18px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th{background:var(--hd);text-align:left;padding:8px;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--bd);white-space:nowrap}
.n{text-align:right}.in{color:var(--ok)}.neg{color:var(--er);font-weight:600}tfoot td{font-weight:700;background:var(--hd)}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px}
.lo{background:rgba(198,40,40,.18)}
.rs{background:none;border:0;color:var(--mu);cursor:pointer;font-size:12px;text-decoration:underline}
svg text{fill:var(--mu);font-size:11px}.lg{font-size:12px;color:var(--mu)}
</style></head><body><main>
<h1>🍋 Frutería Tropical <span>Costa</span></h1>
<nav id="nav"></nav><div id="app"></div>
<button class="rs" onclick="rs()">Vaciar todos los datos</button>
</main>
<script>
const PR={"Mango":[2.5,1.4,"Subtropicales de la Costa"],"Chirimoya":[2,1.1,"Subtropicales de la Costa"],"Caqui":[3,1.7,"Frutas Vega del Guadalfeo"],"Aguacate Hass (rugoso)":[4,2.4,"Finca El Peñón"],"Papaya":[3,1.7,"Finca El Peñón"],"Guayaba":[3,1.6,"Subtropicales de la Costa"],"Plátano de Salobreña":[3,1.7,"Frutas Vega del Guadalfeo"],"Granada":[2.5,1.3,"Frutas Vega del Guadalfeo"]};
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const E=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}),K=new Intl.NumberFormat("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>E.format(v),kg=v=>K.format(v),fd=s=>s.split("-").reverse().join("/"),mm=s=>+s.slice(5,7);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
let V=[],C=[],tab=0,sel=new Date().getMonth()+1,msg="";
try{V=JSON.parse(localStorage.getItem("caja")||"[]");C=JSON.parse(localStorage.getItem("compras")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("caja",JSON.stringify(V));localStorage.setItem("compras",JSON.stringify(C))}catch(e){}};
const iv=r=>PR[r.p][0]*r.kg,ic=r=>PR[r.p][1]*r.kg;
const opts=Object.keys(PR).map(p=>`<option>${p}</option>`).join("");
function form(k,ph,lab){return`<div class="card"><h2>${k==="V"?"Registrar venta":"Registrar compra"}</h2><form onsubmit="add(event,'${k}')"><label>Fecha<input type="date" name="f" value="${new Date().toISOString().slice(0,10)}" required></label><label>${lab}<input name="t" placeholder="${ph}" size="8" required></label><label>Producto<select name="p">${opts}</select></label><label>Kg<input name="kg" type="number" step="0.01" min="0.01" style="width:90px" required></label><button class="btn">Añadir</button><div class="msg">${msg}</div></form></div>`}
function add(e,k){e.preventDefault();const f=new FormData(e.target),r={f:f.get("f"),t:f.get("t").trim(),p:f.get("p"),kg:+f.get("kg")};
 if(!r.t||!r.f||!(r.kg>0)){msg="Rellena todos los campos.";return render()}
 (k==="V"?V:C).push(r);msg="";save();render()}
function del(k,i){(k==="V"?V:C).splice(i,1);save();render()}
function rs(){if(confirm("¿Borrar todas las ventas y compras?")){V=[];C=[];save();render()}}
function vVentas(){const rows=V.map((r,i)=>`<tr><td class="in">${fd(r.f)}</td><td class="in">${r.t}</td><td class="in">${r.p}</td><td class="n">${eur(PR[r.p][0])}</td><td class="n in">${kg(r.kg)}</td><td class="n">${eur(iv(r))}</td><td class="n">${mm(r.f)}</td><td><button class="x" onclick="del('V',${i})" aria-label="Borrar">✕</button></td></tr>`).join("");
 return form("V","T-0001","Nº ticket")+`<div class="card sc"><table><thead><tr><th>Fecha</th><th>Nº ticket</th><th>Producto</th><th class="n">Precio (€/kg)</th><th class="n">Kg</th><th class="n">Importe (€)</th><th class="n">Mes</th><th></th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="4">Total (${V.length} líneas)</td><td class="n">${kg(sum(V,r=>r.kg))}</td><td class="n">${eur(sum(V,iv))}</td><td colspan="2"></td></tr></tfoot></table></div>`}
function vCompras(){const rows=C.map((r,i)=>`<tr><td class="in">${fd(r.f)}</td><td class="in">${r.t}</td><td class="in">${r.p}</td><td>${PR[r.p][2]}</td><td class="n in">${kg(r.kg)}</td><td class="n">${eur(PR[r.p][1])}</td><td class="n">${eur(ic(r))}</td><td class="n">${mm(r.f)}</td><td><button class="x" onclick="del('C',${i})" aria-label="Borrar">✕</button></td></tr>`).join("");
 return form("C","FC-001","Nº factura")+`<div class="card sc"><table><thead><tr><th>Fecha</th><th>Nº factura</th><th>Producto</th><th>Proveedor</th><th class="n">Kg</th><th class="n">Precio compra (€/kg)</th><th class="n">Importe (€)</th><th class="n">Mes</th><th></th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="4">Total (${C.length} compras)</td><td class="n">${kg(sum(C,r=>r.kg))}</td><td></td><td class="n">${eur(sum(C,ic))}</td><td colspan="2"></td></tr></tfoot></table></div>`}
function chart(d){const W=640,H=240,l=50,b=26,t=14,w=W-l-8,h=H-b-t,mx=Math.max(10,...d.map(x=>Math.max(x.v,x.c,x.r))),mn=Math.min(0,...d.map(x=>x.r)),y=v=>t+h*(1-(v-mn)/(mx-mn)),bw=w/12;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ventas, compras y resultado por mes">`;
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;s+=`<line x1="${l}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${l-5}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
 d.forEach((x,i)=>{const X=l+i*bw;s+=`<rect x="${X+bw*.12}" y="${Math.min(y(x.v),y(0))}" width="${bw*.34}" height="${Math.abs(y(0)-y(x.v))}" fill="var(--c1)"/><rect x="${X+bw*.5}" y="${Math.min(y(x.c),y(0))}" width="${bw*.34}" height="${Math.abs(y(0)-y(x.c))}" fill="var(--c2)"/><text x="${X+bw/2}" y="${H-8}" text-anchor="middle">${MES[i].slice(0,3)}</text>`});
 s+=`<polyline fill="none" stroke="var(--tx)" stroke-width="2" points="${d.map((x,i)=>`${l+i*bw+bw/2},${y(x.r)}`).join(" ")}"/></svg>`;
 return s+`<div class="lg"><span style="color:var(--c1)">■</span> Ventas &nbsp;<span style="color:var(--c2)">■</span> Compras &nbsp;<b style="color:var(--tx)">—</b> Resultado</div>`}
function vBal(){const d=MES.map((m,i)=>{const v=sum(V.filter(r=>mm(r.f)===i+1),iv),c=sum(C.filter(r=>mm(r.f)===i+1),ic);return{m,n:i+1,v,c,r:v-c}});
 const rc=r=>`<td class="n ${r<0?"neg":""}">${eur(r)}</td>`,TV=sum(d,x=>x.v),TC=sum(d,x=>x.c);
 const rows=d.map(x=>`<tr><td>${x.m}</td><td class="n">${x.n}</td><td class="n">${eur(x.v)}</td><td class="n">${eur(x.c)}</td>${rc(x.r)}</tr>`).join("");
 const pr=Object.keys(PR).map(p=>{const vs=V.filter(r=>r.p===p&&mm(r.f)===sel),cs=C.filter(r=>r.p===p&&mm(r.f)===sel);return`<tr><td>${p}</td><td class="n">${kg(sum(vs,r=>r.kg))}</td><td class="n">${eur(sum(vs,iv))}</td><td class="n">${kg(sum(cs,r=>r.kg))}</td><td class="n">${eur(sum(cs,ic))}</td></tr>`}).join("");
 return`<div class="card sc"><h2>Balance mensual 2026</h2><table><thead><tr><th>Mes</th><th class="n">Nº mes</th><th class="n">Ventas (€)</th><th class="n">Compras (€)</th><th class="n">Resultado (€)</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="2">Total año</td><td class="n">${eur(TV)}</td><td class="n">${eur(TC)}</td>${rc(TV-TC)}</tr></tfoot></table></div>
 <div class="card"><h2>Gráfico</h2>${chart(d)}</div>
 <div class="card sc"><h2>Detalle por producto · mes <select onchange="sel=+this.value;render()">${MES.map((m,i)=>`<option value="${i+1}" ${i+1===sel?"selected":""}>${i+1} · ${m}</option>`).join("")}</select></h2><table><thead><tr><th>Producto</th><th class="n">Kg vendidos</th><th class="n">Ventas (€)</th><th class="n">Kg comprados</th><th class="n">Compras (€)</th></tr></thead><tbody>${pr}</tbody></table></div>`}
function vStock(){const rows=Object.keys(PR).map(p=>{const b=sum(C.filter(r=>r.p===p),r=>r.kg),v=sum(V.filter(r=>r.p===p),r=>r.kg),s=b-v;return`<tr><td>${p}</td><td class="n">${kg(b)}</td><td class="n">${kg(v)}</td><td class="n ${s<5?"lo":""} ${s<0?"neg":""}">${kg(s)}</td></tr>`}).join("");
 return`<div class="card sc"><h2>Stock por producto</h2><table><thead><tr><th>Producto</th><th class="n">Kg comprados</th><th class="n">Kg vendidos</th><th class="n">Stock (kg)</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Total</td><td class="n">${kg(sum(C,r=>r.kg))}</td><td class="n">${kg(sum(V,r=>r.kg))}</td><td class="n">${kg(sum(C,r=>r.kg)-sum(V,r=>r.kg))}</td></tr></tfoot></table><p class="lg">Stock = kg comprados − kg vendidos. Fondo rojo: quedan menos de 5 kg.</p></div>`}
function setTab(i){tab=i;msg="";render()}
function render(){document.getElementById("nav").innerHTML=["Ventas","Compras","Balance mensual","Stock"].map((t,i)=>`<button class="${i===tab?"on":""}" onclick="setTab(${i})">${t}</button>`).join("");
 document.getElementById("app").innerHTML=[vVentas,vCompras,vBal,vStock][tab]()}
render();
</script></body></html>
